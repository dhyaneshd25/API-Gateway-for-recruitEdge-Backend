server.port=${PORT:8080}

spring.application.name=api-gateway

# Global CORS configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[2]=https://recruitment-management-system-front-two.vercel.app
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[3]=https://recruitment-management-system-front-delta.vercel.app
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${BACKEND_SERVICE_URL:https://recuritement-management-system-backend-y6n6.onrender.com}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=${BACKEND_SERVICE_URL:https://recuritement-management-system-backend-y6n6.onrender.com}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/user/**

spring.cloud.gateway.routes[2].id=job-service
spring.cloud.gateway.routes[2].uri=${BACKEND_SERVICE_URL:https://recuritement-management-system-backend-y6n6.onrender.com}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/job/**

spring.cloud.gateway.routes[3].id=candidate-service
spring.cloud.gateway.routes[3].uri=${BACKEND_SERVICE_URL:https://recuritement-management-system-backend-y6n6.onrender.com}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/candidate/**

spring.cloud.gateway.routes[4].id=interview-service
spring.cloud.gateway.routes[4].uri=${BACKEND_SERVICE_URL:https://recuritement-management-system-backend-y6n6.onrender.com}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/interview/**

spring.cloud.gateway.routes[5].id=aiinterview-service
spring.cloud.gateway.routes[5].uri=${BACKEND_SERVICE_URL:https://recuritement-management-system-backend-y6n6.onrender.com}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/aiinterview/**

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=INFO
